<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bootstrap Collapse Test</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="mb-3">
  <button class="btn btn-primary w-100 text-start" 
          data-bs-toggle="collapse" 
          data-bs-target="#dcNotes" 
          aria-expanded="false" 
          aria-controls="dcNotes">
    🌐 Data Communication
  </button>

  <div class="collapse mt-2" id="dcNotes">
    <div class="card card-body">
      <h6>Data Communication</h6>
      This is a test collapse section.  
    </div>
  </div>
</div>

<!-- Bootstrap JS bundle must be here -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
