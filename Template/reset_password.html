{% extends "base1.html" %}

{% block title %}🔒 Reset Password | Study Quiz Hub{% endblock %}

{% block content %}

<style>

.reset-page{

    min-height:calc(100vh - 80px);

    display:flex;

    align-items:center;

    justify-content:center;

    padding:50px 20px;

    background:
        radial-gradient(
            circle at 10% 20%,
            rgba(255,0,100,.15),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(98,0,255,.15),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #f8fbff,
            #eef5ff,
            #faf5ff
        );
}


.reset-card{

    width:100%;

    max-width:480px;

    padding:40px;

    border-radius:30px;

    background:
        rgba(255,255,255,.75);

    border:
        1px solid rgba(255,255,255,.95);

    backdrop-filter:blur(25px);

    -webkit-backdrop-filter:blur(25px);

    box-shadow:
        0 25px 70px rgba(31,41,55,.18);

    position:relative;

    overflow:hidden;
}


.reset-card::before{

    content:"";

    position:absolute;

    top:0;
    left:0;
    right:0;

    height:6px;

    background:
        linear-gradient(
            90deg,
            #ff1744,
            #ff9800,
            #ffee00,
            #00c853,
            #00b0ff,
            #7c4dff
        );

    background-size:300%;

    animation:rainbow 5s linear infinite;
}


@keyframes rainbow{

    100%{
        background-position:300%;
    }

}


.reset-icon{

    width:75px;
    height:75px;

    display:flex;

    align-items:center;
    justify-content:center;

    margin:0 auto 20px;

    border-radius:22px;

    font-size:2.5rem;

    background:
        linear-gradient(
            135deg,
            #ff1744,
            #c026d3,
            #6366f1
        );

    box-shadow:
        0 12px 30px rgba(124,77,255,.3);
}


.reset-card h1{

    text-align:center;

    color:#172033 !important;

    font-size:2rem;

    font-weight:900;

    margin-bottom:10px;
}


.reset-description{

    text-align:center;

    color:#667085 !important;

    line-height:1.7;

    margin-bottom:25px;
}


.email-display{

    padding:12px 15px;

    border-radius:12px;

    background:
        rgba(124,77,255,.07);

    border:
        1px solid rgba(124,77,255,.12);

    text-align:center;

    color:#5b21b6;

    font-weight:700;

    margin-bottom:25px;

    word-break:break-word;
}


.password-wrapper{

    position:relative;

    margin-bottom:18px;
}


.password-wrapper .form-floating{

    margin-bottom:0;
}


.form-control{

    height:58px;

    border-radius:15px;

    border:1px solid #dbe2ea;

    background:rgba(255,255,255,.9);
}


.form-control:focus{

    border-color:#7c4dff;

    box-shadow:
        0 0 0 4px rgba(124,77,255,.10);
}


.password-toggle{

    position:absolute;

    right:18px;

    top:20px;

    z-index:10;

    cursor:pointer;

    color:#667085;
}


.password-toggle:hover{

    color:#7c4dff;
}


.password-help{

    color:#98a2b3;

    font-size:.8rem;

    margin:
        -8px 0 20px 5px;
}


.btn-update{

    height:56px;

    border:none;

    border-radius:15px;

    color:white !important;

    font-weight:800;

    background:
        linear-gradient(
            90deg,
            #ff1744,
            #c026d3,
            #6366f1
        );

    background-size:200%;

    transition:.3s;
}


.btn-update:hover{

    transform:translateY(-3px);

    background-position:100%;

    box-shadow:
        0 12px 30px rgba(124,77,255,.3);
}


.back-login{

    text-align:center;

    margin-top:25px;
}


.back-login a{

    color:#6d28d9;

    font-weight:800;

    text-decoration:none;
}


.back-login a:hover{

    text-decoration:underline;

    color:#e11d48;
}


@media(max-width:576px){

    .reset-card{

        padding:30px 22px;

    }

}

</style>


<div class="reset-page">

    <div class="reset-card">


        <div class="reset-icon">
            🔒
        </div>


        <h1>
            Create New Password
        </h1>


        <p class="reset-description">

            Enter a new password for your
            Study Quiz Hub account.

        </p>


        <div class="email-display">

            <i class="bi bi-envelope-fill me-2"></i>

            {{ email }}

        </div>


        <form
            method="POST"
            action="{{ url_for('reset_password') }}"
        >


            <!-- NEW PASSWORD -->

            <div class="password-wrapper">

                <div class="form-floating">

                    <input
                        type="password"
                        name="password"
                        id="password"
                        class="form-control"
                        placeholder="New Password"
                        minlength="6"
                        required
                    >

                    <label for="password">

                        <i class="bi bi-lock-fill me-2"></i>

                        New Password

                    </label>

                </div>


                <i
                    class="bi bi-eye-fill password-toggle"
                    onclick="togglePassword('password', this)"
                ></i>

            </div>


            <div class="password-help">

                Minimum 6 characters

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="password-wrapper">

                <div class="form-floating">

                    <input
                        type="password"
                        name="confirm_password"
                        id="confirm_password"
                        class="form-control"
                        placeholder="Confirm Password"
                        minlength="6"
                        required
                    >

                    <label for="confirm_password">

                        <i class="bi bi-shield-lock-fill me-2"></i>

                        Confirm Password

                    </label>

                </div>


                <i
                    class="bi bi-eye-fill password-toggle"
                    onclick="togglePassword('confirm_password', this)"
                ></i>

            </div>


            <button
                type="submit"
                class="btn btn-update w-100"
            >

                <i class="bi bi-check-circle-fill me-2"></i>

                Update Password

            </button>


        </form>


        <div class="back-login">

            <a href="{{ url_for('login') }}">

                ← Back to Login

            </a>

        </div>


    </div>

</div>


<script>

function togglePassword(id, icon){

    const input =
        document.getElementById(id);


    if(input.type === "password"){

        input.type = "text";

        icon.classList.remove(
            "bi-eye-fill"
        );

        icon.classList.add(
            "bi-eye-slash-fill"
        );

    }
    else{

        input.type = "password";

        icon.classList.remove(
            "bi-eye-slash-fill"
        );

        icon.classList.add(
            "bi-eye-fill"
        );

    }

}

</script>


{% endblock %}
