{% extends "base1.html" %}

{% block title %}🔑 Forgot Password | Study Quiz Hub{% endblock %}

{% block content %}

<style>

.forgot-page{

    min-height:calc(100vh - 80px);

    display:flex;

    align-items:center;

    justify-content:center;

    padding:50px 20px;

    background:
        radial-gradient(
            circle at 10% 20%,
            rgba(255,0,100,.15),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(98,0,255,.15),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #f8fbff,
            #eef5ff,
            #faf5ff
        );
}


.forgot-card{

    width:100%;

    max-width:480px;

    padding:40px;

    border-radius:30px;

    background:
        rgba(255,255,255,.75);

    border:
        1px solid rgba(255,255,255,.95);

    backdrop-filter:blur(25px);

    -webkit-backdrop-filter:blur(25px);

    box-shadow:
        0 25px 70px rgba(31,41,55,.18);

    position:relative;

    overflow:hidden;
}


.forgot-card::before{

    content:"";

    position:absolute;

    top:0;
    left:0;
    right:0;

    height:6px;

    background:
        linear-gradient(
            90deg,
            #ff1744,
            #ff9800,
            #ffee00,
            #00c853,
            #00b0ff,
            #7c4dff
        );

    background-size:300%;

    animation:rainbow 5s linear infinite;
}


@keyframes rainbow{

    100%{
        background-position:300%;
    }

}


.forgot-icon{

    width:75px;
    height:75px;

    display:flex;

    align-items:center;
    justify-content:center;

    margin:0 auto 20px;

    border-radius:22px;

    font-size:2.5rem;

    background:
        linear-gradient(
            135deg,
            #ff1744,
            #c026d3,
            #6366f1
        );

    box-shadow:
        0 12px 30px rgba(124,77,255,.3);
}


.forgot-card h1{

    text-align:center;

    color:#172033 !important;

    font-size:2rem;

    font-weight:900;

    margin-bottom:10px;
}


.forgot-description{

    text-align:center;

    color:#667085 !important;

    line-height:1.7;

    margin-bottom:30px;
}


.form-floating{

    margin-bottom:20px;
}


.form-control{

    height:58px;

    border-radius:15px;

    border:1px solid #dbe2ea;

    background:rgba(255,255,255,.9);
}


.form-control:focus{

    border-color:#7c4dff;

    box-shadow:
        0 0 0 4px rgba(124,77,255,.10);
}


.btn-reset{

    height:56px;

    border:none;

    border-radius:15px;

    color:white !important;

    font-weight:800;

    background:
        linear-gradient(
            90deg,
            #ff1744,
            #c026d3,
            #6366f1
        );

    background-size:200%;

    transition:.3s;
}


.btn-reset:hover{

    transform:translateY(-3px);

    background-position:100%;

    box-shadow:
        0 12px 30px rgba(124,77,255,.3);
}


.back-login{

    text-align:center;

    margin-top:25px;
}


.back-login a{

    color:#6d28d9;

    font-weight:800;

    text-decoration:none;
}


.back-login a:hover{

    text-decoration:underline;

    color:#e11d48;
}


@media(max-width:576px){

    .forgot-card{

        padding:30px 22px;

    }

}

</style>


<div class="forgot-page">

    <div class="forgot-card">

        <div class="forgot-icon">
            🔑
        </div>

        <h1>
            Forgot Password?
        </h1>

        <p class="forgot-description">

            Enter the email address associated with
            your Study Quiz Hub account.

        </p>


        <form method="POST"
              action="{{ url_for('forgot_password') }}">


            <div class="form-floating">

                <input
                    type="email"
                    name="email"
                    id="email"
                    class="form-control"
                    placeholder="Email Address"
                    required
                >

                <label for="email">

                    <i class="bi bi-envelope-fill me-2"></i>

                    Email Address

                </label>

            </div>


            <button
                type="submit"
                class="btn btn-reset w-100"
            >

                <i class="bi bi-arrow-right-circle me-2"></i>

                Continue

            </button>

        </form>


        <div class="back-login">

            <a href="{{ url_for('login') }}">

                ← Back to Login

            </a>

        </div>

    </div>

</div>

{% endblock %}
