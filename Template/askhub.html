{% extends "base1.html" %}
{% block content %}
<style>

.chat-card{
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:30px;
    overflow:hidden;
    box-shadow:0 25px 60px rgba(0,0,0,.35);
    animation:cardFloat 6s ease-in-out infinite;
}

@keyframes cardFloat{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-8px);
}

}

.chat-header{

background:linear-gradient(
135deg,
#0d6efd,
#6610f2,
#00c6ff);

background-size:300%;

animation:gradientMove 8s linear infinite;

padding:30px;

text-align:center;

color:white;

}

@keyframes gradientMove{

100%{
background-position:300%;
}

}
.ai-avatar{

width:70px;

height:70px;

border-radius:50%;

animation:pulse 2s infinite;

}

@keyframes pulse{

0%{
box-shadow:0 0 0 0 rgba(0,255,255,.6);
}

100%{
box-shadow:0 0 0 25px transparent;
}

}

.chat-header h2{
    font-weight:700;
}

#chatMessages{

height:550px;

background:

linear-gradient(
180deg,
#eef5ff,
#ffffff);

background-image:

radial-gradient(circle,#dfe9ff 1px,transparent 1px);

background-size:25px 25px;

}
.user-msg{
    display:flex;
    justify-content:flex-end;
    margin-bottom:15px;
}

.user-msg span{

background:

linear-gradient(
135deg,
#00c853,
#00e676);

border-radius:25px 25px 5px 25px;

font-size:16px;

padding:14px 18px;

}

.bot-msg{
    display:flex;
    align-items:flex-start;
    gap:10px;
    margin-bottom:15px;
}

.bot-msg span{

background:white;

border-radius:25px 25px 25px 5px;

border-left:5px solid #0d6efd;

font-size:16px;

}
.chat-input{

border-radius:50px;

padding:16px 22px;

background:white;

font-size:17px;

border:2px solid transparent;

transition:.3s;

}

.chat-input:focus{

border-color:#0d6efd;

box-shadow:0 0 20px rgba(13,110,253,.3);

}

.voice-btn{
    width:55px;
    height:55px;
    border-radius:50%;
    border:none;
    margin-left:10px;
    background:linear-gradient(135deg,#dc3545,#ff6b6b);
}

.send-btn{
    border-radius:50px;
    padding:0 30px;
    margin-left:10px;
    background:linear-gradient(135deg,#0d6efd,#6610f2);
    border:none;
}

.voice-btn,
.send-btn{

transition:.3s;

}

.voice-btn:hover,
.send-btn:hover{

transform:scale(1.08);

box-shadow:0 0 20px rgba(13,110,253,.4);

}

.typing{

display:flex;

gap:6px;

padding:12px;

}

.typing span{

width:10px;

height:10px;

background:#0d6efd;

border-radius:50%;

animation:bounce 1s infinite;

}

.typing span:nth-child(2){

animation-delay:.2s;

}

.typing span:nth-child(3){

animation-delay:.4s;

}

@keyframes bounce{

50%{

transform:translateY(-8px);

}

}



#chatMessages::-webkit-scrollbar{
    width:8px;
}

#chatMessages::-webkit-scrollbar-thumb{
    background:#cfd8dc;
    border-radius:20px;
}

</style>

<div class="container py-5">

    <div class="card chat-card">

        <div class="chat-header">
            <h2>🤖 ASKHUB AI Assistant</h2>

<p>
Powered by Artificial Intelligence
</p>

<span class="badge bg-success">
🟢 Online
</span>
        </div>

        <div class="card-body">

            <div id="chatMessages">

                <div class="bot-msg">

                    <img
                    src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png"
                    class="ai-avatar">

                    <span>
                        👋 Hello Student! I am your ASKHUB Assistant.
                    </span>

                </div>

            </div>
            <div class="text-center mt-3 mb-3">

    <button class="btn btn-outline-primary btn-sm suggestion-btn"
            onclick="fillQuestion('Explain Python basics')">
        🐍 Python
    </button>

    <button class="btn btn-outline-success btn-sm suggestion-btn"
            onclick="fillQuestion('Explain Java OOP concepts')">
        ☕ Java
    </button>

    <button class="btn btn-outline-danger btn-sm suggestion-btn"
            onclick="fillQuestion('Explain HTML tags')">
        🌐 HTML
    </button>

    <button class="btn btn-outline-warning btn-sm suggestion-btn"
            onclick="fillQuestion('Explain JavaScript DOM')">
        ⚡ JavaScript
    </button>

    <button class="btn btn-outline-info btn-sm suggestion-btn"
            onclick="fillQuestion('Explain SQL joins')">
        🐬 SQL
    </button>

</div>



            <div class="d-flex align-items-center mt-3">

                <input
                    type="text"
                    id="userInput"
                    class="form-control chat-input "
                    placeholder="Ask your programming or quiz question..."
                    onkeypress="if(event.key==='Enter') sendMessage()"
                >


                <button
                    class="btn voice-btn"
                    onclick="startVoice()">
                    🎤
                </button>

                <button
                    class="btn text-white send-btn"
                    onclick="sendMessage()">
                    🚀 Send
                </button>

            </div>

        </div>

    </div>

</div>

<script>

function sendMessage(){

    let input =
    document.getElementById("userInput");

    let msg =
    input.value.trim();

    if(msg==="") return;

    let chat =
    document.getElementById("chatMessages");

    chat.innerHTML += `
    <div class="user-msg">
        <span>${msg}</span>
    </div>
    `;

    chat.innerHTML += `
    <div id="typing" class="typing">
   🤖 AI is typing...
   <span></span>
    </div>
    `;

    chat.scrollTop =
    chat.scrollHeight;

    fetch("/askhub",{
        method:"POST",
        headers:{
            "Content-Type":
            "application/x-www-form-urlencoded"
        },
        body:"message="+encodeURIComponent(msg)
    })

    .then(res=>res.json())

    .then(data=>{

        document
        .getElementById("typing")
        .remove();

        chat.innerHTML += `
        <div class="bot-msg">

            <img src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png"
                 width="40">

            <span>
                🤖 ${data.reply}
            </span>

        </div>
        `;

        speak(data.reply);

        chat.scrollTop =
        chat.scrollHeight;
    });

    input.value="";
}

function startVoice(){

    const recognition = new webkitSpeechRecognition();

    recognition.lang = "en-US";

    recognition.onresult = function(event){

        let text = event.results[0][0].transcript;

        console.log("VOICE:", text);

        document.getElementById("userInput").value = text;

        sendMessage();
    };

    recognition.onerror = function(e){
        console.log("VOICE ERROR:", event.error);
    };

    recognition.start();
}
function speak(text){

    window.speechSynthesis.cancel();

    let speech =
    new SpeechSynthesisUtterance(text);

    speech.lang="en-US";
    speech.rate=1;
    speech.pitch=1;
    speech.volume=1;

    window.speechSynthesis.speak(speech);
}

</script>

{% endblock %}
