{% extends "base1.html" %}

{% block content %}

<style>

/* ===============================
   ASK HUB MAIN
================================ */

.askhub-wrapper{
    width:100%;
    max-width:1100px;
    height:calc(100vh - 120px);
    min-height:600px;
    margin:25px auto;
    display:flex;
    flex-direction:column;

    background:#0b1020;
    border:1px solid rgba(255,255,255,.12);
    border-radius:24px;

    overflow:hidden;

    box-shadow:
        0 25px 70px rgba(0,0,0,.45),
        0 0 40px rgba(99,102,241,.12);
}


/* ===============================
   HEADER
================================ */

.askhub-header{
    min-height:92px;
    padding:20px 26px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:
        linear-gradient(
            135deg,
            #18223b,
            #111827
        );

    border-bottom:1px solid rgba(255,255,255,.10);
}


.askhub-title{
    display:flex;
    align-items:center;
    gap:12px;
}


.askhub-icon{
    width:45px;
    height:45px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:27px;

    background:rgba(99,102,241,.15);
    border:1px solid rgba(99,102,241,.3);

    border-radius:14px;
}


.askhub-title h2{
    margin:0;

    color:white;
    font-size:24px;
    font-weight:700;
}


.askhub-title p{
    margin:4px 0 0;

    color:#94a3b8;
    font-size:13px;
}


/* ===============================
   HEADER BUTTONS
================================ */

.chat-actions{
    display:flex;
    gap:10px;
}


.chat-action-btn{
    border:1px solid rgba(255,255,255,.15);

    background:rgba(255,255,255,.07);

    color:#f8fafc;

    padding:10px 15px;

    border-radius:12px;

    font-size:14px;
    font-weight:600;

    cursor:pointer;

    transition:.25s;
}


.chat-action-btn:hover{
    background:rgba(99,102,241,.25);
    border-color:#6366f1;
    transform:translateY(-1px);
}


/* ===============================
   CHAT AREA
================================ */

.chat-area{
    flex:1;

    overflow-y:auto;

    padding:28px 30px;

    scroll-behavior:smooth;

    background:
        radial-gradient(
            circle at top,
            rgba(99,102,241,.06),
            transparent 45%
        ),
        #0b1224;
}


/* scrollbar */

.chat-area::-webkit-scrollbar{
    width:7px;
}

.chat-area::-webkit-scrollbar-track{
    background:transparent;
}

.chat-area::-webkit-scrollbar-thumb{
    background:#334155;
    border-radius:20px;
}


/* ===============================
   MESSAGE ROW
================================ */

.message-row{
    display:flex;
    width:100%;
    margin-bottom:22px;
}


.message-row.user{
    justify-content:flex-end;
}


.message-row.bot{
    justify-content:flex-start;
}


/* ===============================
   BOT MESSAGE
================================ */

.bot-message{
    display:flex;
    align-items:flex-start;
    gap:12px;

    max-width:78%;
}


.bot-avatar{
    width:38px;
    height:38px;

    flex-shrink:0;

    border-radius:50%;

    background:#172033;

    border:1px solid rgba(255,255,255,.15);

    padding:5px;
}


.bot-bubble{
    position:relative;

    background:#1f293b;

    color:#e5e7eb;

    border:1px solid rgba(255,255,255,.08);

    padding:13px 17px;

    border-radius:8px 18px 18px 18px;

    font-size:15px;
    line-height:1.55;

    max-width:700px;

    word-wrap:break-word;

    box-shadow:0 5px 20px rgba(0,0,0,.12);
}


.bot-bubble p{
    margin:0 0 8px;
}


.bot-bubble p:last-child{
    margin-bottom:0;
}


/* ===============================
   USER MESSAGE
================================ */

.user-bubble{
    max-width:65%;

    padding:12px 17px;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #7c3aed
        );

    color:white;

    border-radius:18px 18px 5px 18px;

    font-size:15px;
    line-height:1.5;

    word-wrap:break-word;

    box-shadow:
        0 7px 20px rgba(99,102,241,.20);
}


/* ===============================
   SPEAKER BUTTON
================================ */

.speak-btn{
    margin-top:9px;

    border:0;

    background:rgba(255,255,255,.08);

    color:#cbd5e1;

    border-radius:8px;

    padding:4px 9px;

    font-size:12px;

    cursor:pointer;

    transition:.2s;
}


.speak-btn:hover{
    background:rgba(99,102,241,.3);
    color:white;
}


/* ===============================
   WELCOME MESSAGE
================================ */

.welcome-message{
    display:flex;
    align-items:flex-start;
    gap:12px;

    margin-bottom:28px;
}


.welcome-bubble{
    max-width:620px;

    background:#1f293b;

    border:1px solid rgba(255,255,255,.08);

    padding:15px 18px;

    border-radius:8px 18px 18px 18px;

    color:#e5e7eb;

    line-height:1.6;
}


.welcome-title{
    font-weight:700;
    color:white;
    margin-bottom:5px;
}


/* ===============================
   THINKING
================================ */

.thinking{
    display:flex;
    align-items:center;
    gap:5px;
}


.thinking span{
    width:7px;
    height:7px;

    background:#94a3b8;

    border-radius:50%;

    animation:thinking 1.2s infinite;
}


.thinking span:nth-child(2){
    animation-delay:.2s;
}


.thinking span:nth-child(3){
    animation-delay:.4s;
}


@keyframes thinking{

    0%,60%,100%{
        opacity:.25;
        transform:translateY(0);
    }

    30%{
        opacity:1;
        transform:translateY(-3px);
    }

}


/* ===============================
   SUGGESTIONS
================================ */

.suggestions{
    padding:13px 20px;

    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:9px;

    background:#0d1528;

    border-top:1px solid rgba(255,255,255,.07);
}


.suggestion-btn{
    background:transparent;

    padding:7px 14px;

    border-radius:20px;

    font-size:13px;
    font-weight:600;

    transition:.25s;
}


.suggestion-btn:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,.08);
}


/* ===============================
   INPUT AREA
================================ */

.input-area{
    display:flex;
    align-items:center;
    gap:10px;

    padding:16px 20px;

    background:#111827;

    border-top:1px solid rgba(255,255,255,.10);
}


.chat-input{
    flex:1;

    height:52px;

    padding:0 18px;

    border-radius:27px;

    border:1px solid #334155;

    outline:none;

    background:#1e293b;

    color:white;

    font-size:15px;

    transition:.25s;
}


.chat-input::placeholder{
    color:#94a3b8;
}


.chat-input:focus{
    border-color:#6366f1;

    box-shadow:
        0 0 0 3px rgba(99,102,241,.12);
}


/* ===============================
   VOICE BUTTON
================================ */

.voice-btn{
    width:50px;
    height:50px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.10);

    background:#1e293b;

    color:white;

    font-size:19px;

    cursor:pointer;

    transition:.25s;
}


.voice-btn:hover{
    background:#334155;
    transform:scale(1.05);
}


.voice-btn.listening{
    background:#dc2626;

    animation:pulseVoice 1s infinite;
}


@keyframes pulseVoice{

    0%{
        box-shadow:0 0 0 0 rgba(220,38,38,.5);
    }

    70%{
        box-shadow:0 0 0 12px rgba(220,38,38,0);
    }

    100%{
        box-shadow:0 0 0 0 rgba(220,38,38,0);
    }

}


/* ===============================
   SEND BUTTON
================================ */

.send-btn{
    height:50px;

    min-width:105px;

    border:0;

    border-radius:25px;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #7c3aed
        );

    color:white;

    font-weight:700;

    font-size:14px;

    cursor:pointer;

    transition:.25s;
}


.send-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 8px 25px rgba(99,102,241,.3);
}


.send-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}


/* ===============================
   MOBILE
================================ */

@media(max-width:768px){

    .askhub-wrapper{
        width:96%;
        height:calc(100vh - 100px);

        margin:15px auto;

        border-radius:18px;
    }


    .askhub-header{
        padding:15px;
    }


    .askhub-title h2{
        font-size:19px;
    }


    .askhub-title p{
        display:none;
    }


    .chat-actions{
        gap:5px;
    }


    .chat-action-btn{
        padding:8px 10px;
        font-size:12px;
    }


    .chat-area{
        padding:20px 14px;
    }


    .bot-message{
        max-width:90%;
    }


    .user-bubble{
        max-width:82%;
    }


    .suggestions{
        overflow-x:auto;
        justify-content:flex-start;
        flex-wrap:nowrap;
    }


    .suggestion-btn{
        white-space:nowrap;
    }


    .input-area{
        padding:10px;
    }


    .send-btn{
        min-width:70px;
    }

}

</style>


<!-- =====================================================
     ASK HUB
===================================================== -->

<div class="askhub-wrapper">


    <!-- HEADER -->

    <div class="askhub-header">

        <div class="askhub-title">

            <div class="askhub-icon">
                🤖
            </div>

            <div>

                <h2>ASKHUB AI Assistant</h2>

                <p>
                    Your intelligent programming & quiz assistant
                </p>

            </div>

        </div>


        <div class="chat-actions">

            <button
                type="button"
                class="chat-action-btn"
                onclick="newChat()">

                🆕 New Chat

            </button>


            <button
                type="button"
                class="chat-action-btn"
                onclick="clearHistory()">

                🗑️ Clear

            </button>

        </div>

    </div>


    <!-- CHAT AREA -->

    <div
        id="chatMessages"
        class="chat-area">


        <!-- WELCOME -->

        <div class="welcome-message">

            <img
                src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png"
                class="bot-avatar"
            >

            <div class="welcome-bubble">

                <div class="welcome-title">
                    👋 Hello Student!
                </div>

                I am your
                <strong>ASKHUB AI Assistant.</strong>

                <br>

                Ask me anything about programming,
                quizzes or your courses.

            </div>

        </div>

    </div>


    <!-- SUGGESTIONS -->

    <div class="suggestions">

        <button
            type="button"
            class="btn btn-outline-primary suggestion-btn"
            onclick="fillQuestion('Explain Python basics')">

            🐍 Python

        </button>


        <button
            type="button"
            class="btn btn-outline-success suggestion-btn"
            onclick="fillQuestion('Explain Java OOP concepts')">

            ☕ Java

        </button>


        <button
            type="button"
            class="btn btn-outline-danger suggestion-btn"
            onclick="fillQuestion('Explain HTML tags')">

            🌐 HTML

        </button>


        <button
            type="button"
            class="btn btn-outline-warning suggestion-btn"
            onclick="fillQuestion('Explain JavaScript DOM')">

            ⚡ JavaScript

        </button>


        <button
            type="button"
            class="btn btn-outline-info suggestion-btn"
            onclick="fillQuestion('Explain SQL joins')">

            🐬 SQL

        </button>

    </div>


    <!-- INPUT -->

    <div class="input-area">

        <input
            type="text"
            id="userInput"
            class="chat-input"
            placeholder="Ask your programming or quiz question..."
            autocomplete="off"
        >


        <button
            type="button"
            id="voiceButton"
            class="voice-btn"
            onclick="startVoice()">

            🎤

        </button>


        <button
            type="button"
            id="sendButton"
            class="send-btn"
            onclick="sendMessage()">

            🚀 Send

        </button>

    </div>

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const input = document.getElementById("userInput");
const chatMessages = document.getElementById("chatMessages");
const sendButton = document.getElementById("sendButton");


/* =====================================================
   ENTER KEY
===================================================== */

input.addEventListener("keydown", function(event){

    if(event.key === "Enter"){

        event.preventDefault();

        sendMessage();

    }

});


/* =====================================================
   ADD USER MESSAGE
===================================================== */

function addUserMessage(message){

    const row = document.createElement("div");

    row.className = "message-row user";


    const bubble = document.createElement("div");

    bubble.className = "user-bubble";

    bubble.textContent = message;


    row.appendChild(bubble);

    chatMessages.appendChild(row);


    scrollChat();

}


/* =====================================================
   ADD BOT MESSAGE
===================================================== */

function addBotMessage(message){

    const row = document.createElement("div");

    row.className = "message-row bot";


    const wrapper = document.createElement("div");

    wrapper.className = "bot-message";


    const avatar = document.createElement("img");

    avatar.className = "bot-avatar";

    avatar.src =
        "https://cdn-icons-png.flaticon.com/512/4712/4712109.png";


    const bubble = document.createElement("div");

    bubble.className = "bot-bubble";


    const text = document.createElement("div");

    text.textContent = message;


    const speakButton = document.createElement("button");

    speakButton.type = "button";

    speakButton.className = "speak-btn";

    speakButton.innerHTML = "🔊 Listen";

    speakButton.onclick = function(){

        speakText(message);

    };


    bubble.appendChild(text);

    bubble.appendChild(speakButton);


    wrapper.appendChild(avatar);

    wrapper.appendChild(bubble);

    row.appendChild(wrapper);

    chatMessages.appendChild(row);


    scrollChat();


    return row;

}


/* =====================================================
   THINKING MESSAGE
===================================================== */

function addThinkingMessage(){

    const row = document.createElement("div");

    row.className = "message-row bot";


    const wrapper = document.createElement("div");

    wrapper.className = "bot-message";


    const avatar = document.createElement("img");

    avatar.className = "bot-avatar";

    avatar.src =
        "https://cdn-icons-png.flaticon.com/512/4712/4712109.png";


    const bubble = document.createElement("div");

    bubble.className = "bot-bubble";


    const thinking = document.createElement("div");

    thinking.className = "thinking";


    thinking.innerHTML = `
        <span></span>
        <span></span>
        <span></span>
    `;


    bubble.appendChild(thinking);

    wrapper.appendChild(avatar);

    wrapper.appendChild(bubble);

    row.appendChild(wrapper);

    chatMessages.appendChild(row);


    scrollChat();


    return row;

}


/* =====================================================
   SEND MESSAGE
===================================================== */

function sendMessage(){

    const message = input.value.trim();


    if(!message){

        input.focus();

        return;

    }


    /* User message */

    addUserMessage(message);


    /* Clear input */

    input.value = "";


    /* Disable button */

    sendButton.disabled = true;


    /* Thinking */

    const loading = addThinkingMessage();


    /* Backend */

    fetch("/askhub", {

        method:"POST",

        headers:{
            "Content-Type":
                "application/x-www-form-urlencoded; charset=UTF-8"
        },

        body:new URLSearchParams({

            message:message

        })

    })


    .then(response => {

        if(!response.ok){

            throw new Error(
                "Server returned " + response.status
            );

        }


        return response.json();

    })


    .then(data => {

        loading.remove();


        const reply =
            data.reply ||
            "Sorry, I could not generate an answer.";


        addBotMessage(reply);

    })


    .catch(error => {

        console.error("ASKHUB ERROR:",error);


        loading.remove();


        addBotMessage(
            "❌ Sorry, something went wrong. Please try again."
        );

    })


    .finally(() => {

        sendButton.disabled = false;

        input.focus();

    });

}


/* =====================================================
   SCROLL CHAT
===================================================== */

function scrollChat(){

    setTimeout(() => {

        chatMessages.scrollTop =
            chatMessages.scrollHeight;

    },50);

}


/* =====================================================
   SUGGESTION BUTTON
===================================================== */

function fillQuestion(question){

    input.value = question;

    input.focus();

}


/* =====================================================
   CLEAR CHAT
===================================================== */

function clearHistory(){

    chatMessages.innerHTML = "";

    addBotMessage(
        "👋 Chat cleared! How can I help you?"
    );

}


/* =====================================================
   NEW CHAT
===================================================== */

function newChat(){

    chatMessages.innerHTML = "";


    const row = document.createElement("div");

    row.className = "welcome-message";


    row.innerHTML = `

        <img
            src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png"
            class="bot-avatar"
        >

        <div class="welcome-bubble">

            <div class="welcome-title">
                👋 New Chat
            </div>

            I am ready to help you with
            programming, quizzes and courses.

        </div>

    `;


    chatMessages.appendChild(row);

    scrollChat();

    input.value = "";

    input.focus();

}


/* =====================================================
   VOICE INPUT
===================================================== */

let recognition = null;

function startVoice(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        alert(
            "Voice input is not supported in this browser."
        );

        return;

    }


    if(recognition){

        recognition.stop();

    }


    recognition = new SpeechRecognition();


    recognition.lang = "en-IN";

    recognition.continuous = false;

    recognition.interimResults = false;


    const voiceButton =
        document.getElementById("voiceButton");


    recognition.onstart = function(){

        voiceButton.classList.add("listening");

        voiceButton.innerHTML = "🔴";

    };


    recognition.onresult = function(event){

        const text =
            event.results[0][0].transcript;


        input.value = text;

        input.focus();

    };


    recognition.onerror = function(event){

        console.error(
            "Voice error:",
            event.error
        );

    };


    recognition.onend = function(){

        voiceButton.classList.remove("listening");

        voiceButton.innerHTML = "🎤";

    };


    recognition.start();

}


/* =====================================================
   AI OUTPUT VOICE
===================================================== */

function speakText(text){

    if(!("speechSynthesis" in window)){

        alert(
            "Text-to-speech is not supported in this browser."
        );

        return;

    }


    window.speechSynthesis.cancel();


    const cleanText =
        text.replace(
            /[*#`_]/g,
            ""
        );


    const speech =
        new SpeechSynthesisUtterance(cleanText);


    speech.lang = "en-IN";

    speech.rate = 0.95;

    speech.pitch = 1;


    window.speechSynthesis.speak(speech);

}

</script>

{% endblock %}
